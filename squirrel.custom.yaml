# ~/Library/Rime/squirrel.custom.yaml
# macOS（Squirrel）专属：应用级 ascii_mode / vim_mode + 皮肤。
# Windows 上不读这个文件（对应 weasel.custom.yaml），两端各自生效、互不干扰。

patch:
  app_options:
    com.apple.Spotlight:
      ascii_mode: false
    com.apple.finder:
      ascii_mode: false
    com.apple.Safari:
      ascii_mode: false
    com.apple.Terminal:
      ascii_mode: true
      vim_mode: true
    org.gnu.Emacs:
      ascii_mode: false
    com.tencent.xinWeChat:
      ascii_mode: false
    com.knollsoft.Superkey:
      ascii_mode: false
    org.mozilla.firefox:
      ascii_mode: false
    com.mitchellh.ghostty:
      ascii_mode: false
    com.raycast.macos:
      ascii_mode: false
    net.imput.helium:
      ascii_mode: false
    com.texpile.desktop:
      vim_mode: true

  show_notifications_when: appropriate     # 状态通知，可设为全开（always）全关（never）

  style:
    color_scheme: mac_light
    color_scheme_dark: mac_light

    candidate_list_layout: stacked    # linear 横排 | stacked 竖排
    text_orientation: horizontal     # horizontal | vertical
    font_face: 'PingFang SC'         # 全局字体及大小
    font_point: 18
    label_font_face: 'SF Mono'       # 序号字体
    label_font_point: 13
    comment_font_face: 'PingFang SC' # 注字体
    comment_font_point: 14

  # 皮肤主题
  preset_color_schemes:
    mac_light:
      name: MAC键盘浅色
      horizontal: false                          # true横排，false竖排
      back_color: 0xFFFFFF                      # 候选条背景色
      border_height: 0                          # 窗口上下高度，大于圆角半径才生效
      border_width: 8                           # 窗口左右宽度，大于圆角半径才生效
      candidate_format: "%c %@ "                # 用 1/6 em 空格 U+2005 来控制编号 %c 和候选词 %@ 前后的空间
      comment_text_color: 0x999999              # 拼音等提示文字颜色
      corner_radius: 5                          # 窗口圆角
      hilited_corner_radius: 5                  # 高亮圆角
      hilited_candidate_back_color: 0xD75A00    # 第一候选项背景色
      hilited_candidate_text_color: 0xFFFFFF    # 第一候选项文字颜色
      text_color: 0x424242                      # 拼音行文字颜色
      inline_preedit: true                      # 拼音位于： 候选框 false | 行内 true

    mac_dark:
      name: MAC键盘深色
      horizontal: false                          # true横排，false竖排
      back_color: 0x252a2e                      # 候选条背景色
      border_height: 0                          # 窗口上下高度，大于圆角半径才生效
      border_width: 8                           # 窗口左右宽度，大于圆角半径才生效
      candidate_format: "%c %@ "                # 用 1/6 em 空格 U+2005 来控制编号 %c 和候选词 %@ 前后的空间
      comment_text_color: 0x999999              # 拼音等提示文字颜色
      corner_radius: 5                          # 窗口圆角
      hilited_corner_radius: 5                  # 高亮圆角
      hilited_candidate_back_color: 0xD75A00    # 第一候选项背景色
      hilited_candidate_text_color: 0xFFFFFF    # 第一候选项文字颜色
      text_color: 0x424242                      # 拼音行文字颜色
      label_color: 0x999999                     # 预选栏编号颜色
      candidate_text_color: 0xe9e9ea            # 预选项文字颜色
      inline_preedit: true                      # 拼音位于： 候选框 false | 行内 true
